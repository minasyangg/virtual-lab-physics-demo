<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рабочий лист — Лаба №1</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sheet" id="app">Загрузка...</div>

<script src="engine.js"></script>
<script>
const { getVariantSeed, loadLabSchema, saveProgress, loadProgress } = window.LabEngine;
const seed = getVariantSeed();
let lab, answers;

async function init() {
  lab = await loadLabSchema('lab-01-scale-division.json');
  answers = Object.assign({
    fio: '', klass: '', date: '',
    t11: {}, t12: {}, t13: {},
    q: {}, conclusion: ''
  }, loadProgress(lab.id + '_worksheet'));
  render();
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <span class="variant-badge">Вариант: ${seed}</span>
      <div class="num">Рабочий лист к лабораторной работе № 1</div>
      <h1>${lab.title}</h1>
    </div>

    <div class="section">
      <table>
        <tr><td style="text-align:left;width:25%">ФИО ученика</td><td><input type="text" id="fio" value="${answers.fio}"></td>
            <td style="text-align:left;width:15%">Класс</td><td style="width:15%"><input type="text" id="klass" value="${answers.klass}"></td></tr>
        <tr><td style="text-align:left">Дата</td><td><input type="date" id="date" value="${answers.date}"></td>
            <td style="text-align:left">Вариант</td><td>${seed}</td></tr>
      </table>
    </div>

    <div class="section">
      <h2>Цель работы</h2>
      <p>${lab.goal}</p>
      <h2 style="margin-top:14px">Оборудование и материалы</h2>
      <ul class="equipment-list">${lab.equipment.map(e => `<li>${e}</li>`).join('')}</ul>
    </div>

    <div class="section">
      <span class="bar">Таблица 1.1 — результаты измерений линейками</span>
      <table>
        <thead><tr><th>Линейка</th><th>Цена деления, см</th>
        ${lab.objects.map((o,i)=>`<th>l${i+1} (${o.name}), см</th>`).join('')}
        <th>Погрешность</th></tr></thead>
        <tbody>
          ${lab.rulers.map(r => `<tr>
            <td>${r.label}</td>
            <td><input type="text" data-t11="${r.id}-cena" value="${answers.t11[r.id+'-cena']||''}"></td>
            ${lab.objects.map((o,i)=>`<td><input type="text" data-t11="${r.id}-l${i+1}" value="${answers.t11[r.id+'-l'+(i+1)]||''}"></td>`).join('')}
            <td><input type="text" data-t11="${r.id}-pogr" value="${answers.t11[r.id+'-pogr']||''}"></td>
          </tr>`).join('')}
        </tbody>
      </table>

      <span class="bar">Таблица 1.2 — длины с учётом погрешности</span>
      <table>
        <thead><tr><th>Предмет</th><th>Линейка № 1</th><th>Линейка № 2</th></tr></thead>
        <tbody>
          ${lab.objects.map((o,i)=>`<tr>
            <td>${i+1}. ${o.name}</td>
            <td><input type="text" data-t12="r1-${i}" value="${answers.t12['r1-'+i]||''}"></td>
            <td><input type="text" data-t12="r2-${i}" value="${answers.t12['r2-'+i]||''}"></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="section">
      <span class="bar">Таблица 1.3 — объём жидкости</span>
      <table>
        <thead><tr><th>Ёмкость с водой</th><th>Объём (значение ± погрешность), мл</th></tr></thead>
        <tbody>
          ${lab.vessels.map((v,i)=>`<tr>
            <td>${i+1}. ${v.name}</td>
            <td><input type="text" data-t13="${i}" value="${answers.t13[i]||''}"></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2>Контрольные вопросы</h2>
      ${lab.questions.map((q, i) => `
        <div class="step">
          <div class="instr"><span class="badge-num">${i+1}</span>${q.text}</div>
          <textarea data-q="${q.id}">${answers.q[q.id] || ''}</textarea>
        </div>
      `).join('')}
    </div>

    <div class="section">
      <h2>Выводы</h2>
      <textarea id="conclusion" class="conclusion" placeholder="Сформулируйте вывод...">${answers.conclusion}</textarea>
    </div>

    <div class="section">
      <table>
        <tr><td style="text-align:left;width:33%">Подпись ученика</td><td style="width:33%">&nbsp;</td>
            <td style="text-align:left;width:17%">Отметка учителя</td><td style="width:17%">&nbsp;</td></tr>
      </table>
      <p class="small-note">Комментарий учителя:</p>
      <div style="border:1px solid var(--border);border-radius:6px;min-height:50px;"></div>
    </div>

    <div class="footer-actions no-print">
      <button id="save-btn">Сохранить черновик</button>
      <button id="print-btn" class="secondary">Печать / Сохранить как PDF</button>
      <a class="link-row" href="index.html${location.search}"><button class="secondary">← Назад к виртуальной лабе</button></a>
    </div>
  `;

  bindInputs();
}

function collectAndSave() {
  answers.fio = document.getElementById('fio').value;
  answers.klass = document.getElementById('klass').value;
  answers.date = document.getElementById('date').value;
  answers.conclusion = document.getElementById('conclusion').value;
  document.querySelectorAll('[data-t11]').forEach(el => answers.t11[el.dataset.t11] = el.value);
  document.querySelectorAll('[data-t12]').forEach(el => answers.t12[el.dataset.t12] = el.value);
  document.querySelectorAll('[data-t13]').forEach(el => answers.t13[el.dataset.t13] = el.value);
  document.querySelectorAll('[data-q]').forEach(el => answers.q[el.dataset.q] = el.value);
  saveProgress(lab.id + '_worksheet', answers);
}

function bindInputs() {
  document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('input', collectAndSave);
  });
  document.getElementById('save-btn').addEventListener('click', () => {
    collectAndSave();
    alert('Черновик сохранён локально в этом браузере.');
  });
  // Печать средствами браузера — вместо рендера DOM в картинку (html2pdf.js),
  // который резал контент на страницы независимо от вёрстки и давал пустые
  // страницы в начале. Системный диалог печати уважает @media print и
  // break-inside:avoid из styles.css, поэтому таблицы и вопросы не рвутся
  // пополам, а «Сохранить как PDF» — обычный пункт этого диалога.
  document.getElementById('print-btn').addEventListener('click', () => {
    collectAndSave();
    window.print();
  });
}

init();
</script>
</body>
</html>
