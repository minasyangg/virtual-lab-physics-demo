<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виртуальная лаба №1 — Цена деления шкалы</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
</head>
<body>
<div class="sheet" id="app">Загрузка лабораторной работы...</div>

<script src="engine.js"></script>
<script src="engine/draw.js"></script>
<script src="engine/scene.js"></script>
<script src="engine/widgets/ruler.js"></script>
<script src="engine/widgets/cylinder.js"></script>
<script>
const { getVariantSeed, loadLabSchema, saveProgress, loadProgress } = window.LabEngine;

const seed = getVariantSeed();
let lab, state = { table11: {}, table12: {}, table13: {} };

async function init() {
  lab = await loadLabSchema('lab-01-scale-division.json');
  state = Object.assign({ table11: {}, table12: {}, table13: {} }, loadProgress(lab.id));
  render();
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <span class="variant-badge">Вариант: ${seed}</span>
      <div class="num">Лабораторная работа № 1</div>
      <h1>${lab.title}</h1>
    </div>

    <div class="section">
      <h2>Цель</h2>
      <p>${lab.goal}</p>
      <p class="small-note">Учебник: ${lab.textbookRef}</p>
    </div>

    <div class="section">
      <h2>Оборудование и материалы</h2>
      <ul class="equipment-list">${lab.equipment.map(e => `<li>${e}</li>`).join('')}</ul>
    </div>

    <div class="section">
      <span class="bar">Задание 1. Работа с линейкой</span>
      <p class="small-note">Возьмите предмет со стола и приложите его к линейке — начало и конец измерения нужно совместить со штрихами шкалы самостоятельно.</p>
      <div class="scene-wrap"><div id="scene-task1" class="scene-box"></div></div>
      <table id="table11">
        <thead><tr><th>Линейка</th><th>Цена деления, см</th>
        ${lab.objects.map((o,i)=>`<th>Длина l${i+1} (${o.name}), см</th>`).join('')}
        <th>Погрешность измерения</th></tr></thead>
        <tbody>
          ${lab.rulers.map(r => `<tr data-ruler="${r.id}">
            <td>${r.label}</td>
            <td class="cena"></td>
            ${lab.objects.map((o,i)=>`<td class="l${i+1}"></td>`).join('')}
            <td class="pogr"></td>
          </tr>`).join('')}
        </tbody>
      </table>

      <span class="bar">Таблица 1.2 — длины с учётом погрешности</span>
      <table>
        <thead><tr><th>Измеряемый предмет</th><th>Линейка № 1</th><th>Линейка № 2</th></tr></thead>
        <tbody>
          ${lab.objects.map((o,i)=>`<tr>
            <td>${i+1}. ${o.name}</td>
            <td class="t12" data-ruler="r1" data-obj="${i}"></td>
            <td class="t12" data-ruler="r2" data-obj="${i}"></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="no-print"><button class="secondary" id="reset-task1-btn">Сбросить задание 1</button></div>
    </div>

    <div class="section">
      <span class="bar">Задание 2. Работа с измерительным цилиндром</span>
      <div class="step">
        <div class="instr"><span class="badge-num">1</span>Определите цену деления измерительного цилиндра: цена деления = (верхнее − нижнее значение соседних штрихов) / число делений между ними.</div>
        <div class="widget-box">
          <label>Ваш расчёт цены деления (мл): <input type="number" step="0.1" id="cyl-division" style="width:80px"></label>
          <span class="status" id="cyl-division-status"></span>
        </div>
      </div>
      <div class="step">
        <div class="instr"><span class="badge-num">2</span>Перелейте воду из стакана в мензурку и определите положение уровня воды по нижней точке мениска. Двигайте ползунок «угол взгляда» — только когда взгляд направлен точно на уровень мениска, отсчёт верен; сверху или снизу шкала кажется смещённой.</div>
        <div class="scene-wrap"><div id="scene-task2" class="scene-box"></div></div>
        <div class="widget-box">
          <label class="view-angle-label">
            Угол взгляда:
            <input type="range" id="cyl-view-angle" min="-100" max="100" value="0" step="1">
          </label>
          <div class="view-angle-ticks"><span>сверху вниз</span><span>на уровне глаз</span><span>снизу вверх</span></div>
        </div>
        <div class="widget-box">
          <label>Ваше показание уровня (мл): <input type="number" step="0.1" style="width:80px" id="cyl-read"></label>
          <span class="status" id="cyl-status"></span>
        </div>
      </div>
      <span class="bar">Таблица 1.3 — объём жидкости в разных сосудах</span>
      <table>
        <thead><tr><th>Ёмкость с водой</th><th>Объём жидкости (значение ± погрешность), мл</th></tr></thead>
        <tbody>
          ${lab.vessels.map((v,i)=>`<tr><td>${i+1}. ${v.name}</td><td class="vessel-val" data-idx="${i}"></td></tr>`).join('')}
        </tbody>
      </table>
      <div class="no-print"><button class="secondary" id="reset-task2-btn">Сбросить задание 2</button></div>
    </div>

    <div class="section">
      <h2>Выводы</h2>
      <textarea id="conclusion" placeholder="Сформулируйте вывод о том, что такое цена деления и как она влияет на точность измерений...">${state.conclusion || ''}</textarea>
    </div>

    <div class="footer-actions no-print">
      <button id="save-btn">Сохранить прогресс</button>
      <a class="link-row" href="worksheet.html${location.search}"><button class="secondary">Перейти к письменному рабочему листу →</button></a>
    </div>
  `;

  buildTask1Scene();
  buildTask2Scene();

  document.getElementById('save-btn').addEventListener('click', () => {
    state.conclusion = document.getElementById('conclusion').value;
    saveProgress(lab.id, state);
    alert('Прогресс сохранён локально в этом браузере.');
  });
}

async function buildTask1Scene() {
  const el = document.getElementById('scene-task1');
  const rng = LabEngine.mulberry32(seed + 1);
  const scene = await LabScene.createScene(el, { height: 320 });
  if (window.__EXPOSE_SCENES_FOR_TEST__) window._debugScene1 = scene;

  const widget = LabRulerWidget.attachRulerTask(lab, scene, rng, (rulerId, objIndex, measuredCm, bounds) => {
    const ruler = lab.rulers.find(r => r.id === rulerId);
    const pogr = ruler.divisionCm / 2;
    const row = document.querySelector(`tr[data-ruler="${rulerId}"]`);
    row.querySelector('.cena').textContent = ruler.divisionCm.toFixed(2);
    row.querySelector('.pogr').textContent = '±' + pogr.toFixed(2);
    row.querySelector(`.l${objIndex+1}`).textContent = measuredCm.toFixed(2);

    const t12cell = document.querySelector(`.t12[data-ruler="${rulerId}"][data-obj="${objIndex}"]`);
    if (t12cell) t12cell.textContent = `${measuredCm.toFixed(2)} ± ${pogr.toFixed(2)} см`;
  });

  document.getElementById('reset-task1-btn').addEventListener('click', () => {
    widget.resetAll();
    document.querySelectorAll('#table11 td:not(:first-child), .t12').forEach(el => { el.textContent = ''; });
  });
}

async function buildTask2Scene() {
  const el = document.getElementById('scene-task2');
  const rng = LabEngine.mulberry32(seed + 999);
  const scene = await LabScene.createScene(el, { height: 260 });
  if (window.__EXPOSE_SCENES_FOR_TEST__) window._debugScene2 = scene;

  const divInput = document.getElementById('cyl-division');
  const divStatus = document.getElementById('cyl-division-status');
  divInput.addEventListener('input', () => {
    const v = parseFloat(divInput.value);
    if (!isNaN(v) && Math.abs(v - lab.cylinder.divisionMl) < 0.05) {
      divStatus.textContent = '✓ верно'; divStatus.className = 'status ok';
    } else if (!isNaN(v)) {
      divStatus.textContent = '✗ пересчитайте'; divStatus.className = 'status bad';
    }
  });

  const readInput = document.getElementById('cyl-read');
  const readStatus = document.getElementById('cyl-status');
  const viewAngleInput = document.getElementById('cyl-view-angle');
  let cylinderAligned = false;

  readInput.addEventListener('input', () => {
    const v = parseFloat(readInput.value);
    const tolerance = lab.cylinder.divisionMl;
    if (isNaN(v)) { readStatus.textContent = ''; return; }
    if (!cylinderAligned) {
      readStatus.textContent = '↕ выставьте ползунок «угол взгляда» точно на уровень глаз для верного отсчёта';
      readStatus.className = 'status bad';
      return;
    }
    if (Math.abs(v - lab.cylinder.trueLevelMl) <= tolerance) {
      readStatus.textContent = '✓ верно (в пределах точности прибора)';
      readStatus.className = 'status ok';
    } else {
      readStatus.textContent = '✗ проверьте отсчёт по мениску';
      readStatus.className = 'status bad';
    }
  });

  const cylWidget = LabCylinderWidget.attachCylinderTask(lab, scene, rng, {
    onViewAngleChange(angle, aligned) {
      cylinderAligned = aligned;
      readInput.dispatchEvent(new Event('input'));
    },
  });

  viewAngleInput.addEventListener('input', () => {
    cylWidget.setViewAngle(parseFloat(viewAngleInput.value) / 100);
  });

  const vesselInputs = [];
  lab.vessels.forEach((v, i) => {
    const cell = document.querySelector(`.vessel-val[data-idx="${i}"]`);
    const wrap = document.createElement('div');
    wrap.className = 'widget-box';
    wrap.style.marginTop = '8px';
    const label = document.createElement('label');
    label.textContent = `Сосуд «${v.name}», ваш отсчёт после переливания в мензурку (± ${lab.cylinder.divisionMl/2} мл): `;
    const input = document.createElement('input');
    input.type = 'text'; input.placeholder = `объём, мл`;
    input.style.width = '100px';
    input.addEventListener('input', () => { cell.textContent = input.value; });
    label.appendChild(input);
    wrap.appendChild(label);
    document.querySelector('#scene-task2').parentElement.appendChild(wrap);
    vesselInputs.push({ input, cell });
  });

  document.getElementById('reset-task2-btn').addEventListener('click', () => {
    cylWidget.resetAll();
    viewAngleInput.value = 0;
    divInput.value = '';
    divStatus.textContent = '';
    readInput.value = '';
    readStatus.textContent = '';
    vesselInputs.forEach(({ input, cell }) => { input.value = ''; cell.textContent = ''; });
  });
}

init();
</script>
</body>
</html>
