<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виртуальная лаборатория по физике</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="catalog.css">
</head>
<body>
<div class="catalog" id="app">Загрузка каталога...</div>

<script src="engine.js"></script>
<script>
// Каталог лабораторных работ: класс → четверть → тема. Данные лежат в
// catalog.json, чтобы добавлять новые классы/четверти/темы можно было
// без правки разметки — просто дописать запись в JSON.

let data;
// Какой класс сейчас развёрнут — храним в URL (?grade=7), чтобы ссылка на
// открытый класс была тем, чем можно поделиться, и переживала перезагрузку.
function getOpenGrade() {
  const params = new URLSearchParams(location.search);
  const g = parseInt(params.get('grade'), 10);
  return isNaN(g) ? null : g;
}
function setOpenGrade(grade) {
  const params = new URLSearchParams(location.search);
  if (grade === null) params.delete('grade'); else params.set('grade', grade);
  const qs = params.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

async function init() {
  const res = await fetch('catalog.json');
  data = await res.json();
  render();
}

function countAvailable(grade) {
  let n = 0;
  grade.quarters.forEach(q => q.topics.forEach(t => { if (t.status === 'available') n++; }));
  return n;
}

function render() {
  const openGrade = getOpenGrade();
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="catalog-header">
      <h1>Виртуальная лаборатория по физике</h1>
      <p class="small-note">Выберите класс, затем четверть — внутри откроются темы с интерактивными демонстрациями.</p>
    </header>

    <div class="grade-list">
      ${data.grades.map(g => renderGradeCard(g, g.grade === openGrade)).join('')}
    </div>
  `;

  data.grades.forEach(g => {
    const btn = document.getElementById(`grade-toggle-${g.grade}`);
    if (btn) btn.addEventListener('click', () => {
      setOpenGrade(openGrade === g.grade ? null : g.grade);
      render();
    });
  });
}

function renderGradeCard(g, isOpen) {
  const available = countAvailable(g);
  const total = g.quarters.reduce((n, q) => n + q.topics.length, 0);
  return `
    <section class="grade-card ${isOpen ? 'open' : ''}">
      <button class="grade-toggle" id="grade-toggle-${g.grade}">
        <span class="grade-name">${g.label}</span>
        <span class="grade-count">${available ? `${available} тем${plural(available)} доступно` : 'скоро появятся темы'}</span>
        <span class="grade-arrow">${isOpen ? '▲' : '▼'}</span>
      </button>
      ${isOpen ? `<div class="quarter-list">${g.quarters.map(renderQuarter).join('')}</div>` : ''}
    </section>
  `;
}

function plural(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'а';
  if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'ы';
  return '';
}

function renderQuarter(q) {
  if (!q.topics.length) {
    return `
      <div class="quarter-block">
        <h3>${q.label}</h3>
        <p class="small-note">Темы этой четверти появятся позже.</p>
      </div>
    `;
  }
  return `
    <div class="quarter-block">
      <h3>${q.label}</h3>
      <div class="topic-grid">
        ${q.topics.map(renderTopic).join('')}
      </div>
    </div>
  `;
}

function renderTopic(t) {
  const available = t.status === 'available';
  const inner = `
    <span class="topic-status ${available ? 'ok' : 'soon'}">${available ? 'Доступно' : 'Скоро'}</span>
    <span class="topic-title">${t.title}</span>
  `;
  return available
    ? `<a class="topic-card" href="${t.path}">${inner}</a>`
    : `<div class="topic-card disabled">${inner}</div>`;
}

init();
</script>
</body>
</html>
